sensors:
  - rgbd_camera

rgbd_camera:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /rgbd_camera/points
  max_range: 2.5            # Ignore point cloud data beyond this distance (meters)
  min_range: 0.2            # Ignore point cloud data closer than this distance (meters)
  point_subsample: 2        # Process every Nth point to reduce computational overhead
  neighbor_number: 4        # Noise filtering: minimum adjacent points to validate a voxel
  padding_offset: 0.03      # Add a safety buffer around detected obstacles (meters)
  padding_scale: 1.0        # Scaling multiplier applied to the padding
  max_update_rate: 5.0      # Maximum frequency for updating the Octomap scene (Hz)
  filtered_cloud_topic: filtered_cloud