candidate_transform_node:
  ros__parameters:

    # Legacy array mode remains the default for up_to_suction.launch.py.
    # Coordinator bringup overrides this to suction_result and uses the
    # scene-correlated /sim_suction/result -> /sim_suction/result_base topics.
    message_type: "candidate_array"

    # Topics
    input_topic: "/sim_suction/candidates"
    output_topic: "/sim_suction/candidates_base"

    # Coordinate frames
    source_frame: "helios2_optical_frame"
    target_frame: "base_link"

    # TF availability
    max_tf_wait_sec: 3.0
    retry_period_sec: 0.1

    # Timestamp validation
    require_nonzero_stamp: false